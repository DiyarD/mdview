<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<style>__MDVIEW_HLJS_LIGHT_CSS__</style>
<style>__MDVIEW_HLJS_DARK_CSS__</style>
<style>
  /* Warm editorial minimalism: paper, ink, clay + sage. Calm, academic,
     never corporate. Dark side is "warm charcoal library", not inverted gray. */
  :root{
    --font-scale:1.0;
    --read-width:860px;
    --bar-h:40px;
    --bg:#faf7f1; --fg:#2c2620; --bar:#f2ede2; --border:#e2d8c3; --accent:#2f6f6a;
    --accent-strong:#2c5f5b; --accent-soft:#e2e8da; --link-ul:rgba(47,111,106,.38);
    --drop:#f4efe3; --card:#fffdf8;
    --pre-bg:#f1ebdd; --code-bg:rgba(122,96,58,.13); --quote:#776a52; --quote-bar:#cfc09e;
    --tbl-alt:#f4efe2; --tbl-head-line:#c9bb9c;
    --tbl-hover:#e9dfc6;
    --shadow:0 1px 2px rgba(74,60,38,.07),0 6px 18px rgba(74,60,38,.05);
    --mono:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,Cambria,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1a1512; --fg:#e9e1d3; --bar:#221c16; --border:#3a3227; --accent:#d0a468;
      --accent-strong:#c8a06a; --accent-soft:rgba(200,160,106,.16); --link-ul:rgba(208,164,104,.45);
      --drop:#201a14; --card:#241e17;
      --pre-bg:#231d16; --code-bg:rgba(200,160,106,.13); --quote:#a5977d; --quote-bar:#4d4332;
      --tbl-alt:#201a14; --tbl-head-line:#57493a; --tbl-hover:#2c251c;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); }
  }
  html.dark{ --bg:#1a1512; --fg:#e9e1d3; --bar:#221c16; --border:#3a3227; --accent:#d0a468;
    --accent-strong:#c8a06a; --accent-soft:rgba(200,160,106,.16); --link-ul:rgba(208,164,104,.45);
    --drop:#201a14; --card:#241e17;
    --pre-bg:#231d16; --code-bg:rgba(200,160,106,.13); --quote:#a5977d; --quote-bar:#4d4332;
    --tbl-alt:#201a14; --tbl-head-line:#57493a; --tbl-hover:#2c251c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark; }
  html.light{ --bg:#faf7f1; --fg:#2c2620; --bar:#f2ede2; --border:#e2d8c3; --accent:#2f6f6a;
    --accent-strong:#2c5f5b; --accent-soft:#e2e8da; --link-ul:rgba(47,111,106,.38);
    --drop:#f4efe3; --card:#fffdf8;
    --pre-bg:#f1ebdd; --code-bg:rgba(122,96,58,.13); --quote:#776a52; --quote-bar:#cfc09e;
    --tbl-alt:#f4efe2; --tbl-head-line:#c9bb9c;
    --tbl-hover:#e9dfc6;
    --shadow:0 1px 2px rgba(74,60,38,.07),0 6px 18px rgba(74,60,38,.05);
    color-scheme:light; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--sans); overflow:hidden;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  ::selection{ background:var(--accent-soft); }
  button:focus-visible,.drop:focus-visible,input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #bar{ height:var(--bar-h); display:flex; align-items:center; gap:6px; padding:0 10px; flex:none;
    background:var(--bar); border-bottom:1px solid var(--border); user-select:none; }
  #tabs{ display:flex; align-items:center; gap:4px; flex:1; overflow-x:auto; scrollbar-width:thin; }
  .tab{ display:flex; align-items:center; gap:6px; max-width:220px; padding:5px 6px 5px 11px; border:1px solid transparent;
    border-radius:8px; cursor:pointer; white-space:nowrap; font-size:12.5px; transition:background .15s,border-color .15s; }
  .tab:hover{ background:rgba(122,96,58,.1); }
  .tab.active{ background:var(--card); border-color:var(--border); box-shadow:var(--shadow); }
  .tab .t{ overflow:hidden; text-overflow:ellipsis; }
  .tab .x{ border:0; background:transparent; color:var(--quote); cursor:pointer; border-radius:6px; padding:0 5px; font-size:13px; line-height:1.4; }
  .tab .x:hover{ background:rgba(122,96,58,.16); color:inherit; }
  #newtab{ border:1px solid var(--border); background:transparent; color:inherit; border-radius:8px; cursor:pointer; padding:3px 9px; font-size:14px; transition:background .15s; }
  #newtab:hover{ background:rgba(122,96,58,.12); }
  .ctl{ border:1px solid transparent; background:transparent; color:inherit; border-radius:8px; cursor:pointer;
    padding:4px 7px; font-size:12.5px; white-space:nowrap; transition:background .15s,border-color .15s; }
  .ctl:hover{ background:rgba(122,96,58,.12); border-color:var(--border); }
  .ctl:active,.btn:active,#newtab:active{ transform:scale(.93); }
  #width{ width:90px; accent-color:var(--accent); opacity:.55; }
  #width:hover{ opacity:1; }
  #views{ position:relative; flex:1 1 0%; min-height:0; }
  .view{ position:absolute; inset:0; display:none; overflow-y:auto; }
  .view.active{ display:block; }
  .page{ max-width:var(--read-width); margin:0 auto; padding:40px 36px 96px; transition:max-width .15s ease; position:relative; }
  /* Markdown body: editorial serif prose. Personality lives in type, rhythm
     and hairlines — never in loud color. */
  .markdown-body{ background:transparent !important; color:var(--fg); font-family:var(--serif);
    font-size:calc(16.5px * var(--font-scale)); line-height:1.68; word-wrap:break-word; }
  .markdown-body>*:first-child{ margin-top:0 !important; }
  .markdown-body>*:last-child{ margin-bottom:0 !important; }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{
    margin:1.6em 0 .7em; font-weight:600; line-height:1.22; letter-spacing:-.012em; text-wrap:balance; }
  .markdown-body h1{ font-size:2em; padding-bottom:.35em; border-bottom:1px solid var(--border); }
  .markdown-body h2{ font-size:1.5em; padding-bottom:.3em; border-bottom:1px solid var(--border); }
  .markdown-body h3{ font-size:1.22em; }
  .markdown-body h4{ font-size:1em; }
  .markdown-body h5{ font-size:.88em; letter-spacing:.02em; }
  .markdown-body h6{ font-size:.85em; color:var(--quote); letter-spacing:.04em; }
  .markdown-body p{ margin:0 0 1.05em; }
  .markdown-body a{ color:var(--accent); text-decoration:underline; text-decoration-color:var(--link-ul);
    text-decoration-thickness:1px; text-underline-offset:3px; transition:background .15s; border-radius:3px; }
  .markdown-body a:hover{ text-decoration-color:var(--accent); background:var(--accent-soft); }
  .markdown-body strong{ font-weight:700; }
  .markdown-body hr{ height:1px; margin:2.6em auto; background:var(--border); border:0; }
  .markdown-body blockquote{ margin:0 0 1.4em; padding:.2em 0 .2em 1.1em; color:var(--quote);
    font-style:italic; font-size:1.05em; line-height:1.6; border-left:2px solid var(--quote-bar); }
  .markdown-body blockquote p{ margin:0 0 .6em; }
  .markdown-body ul,.markdown-body ol{ margin:0 0 1.05em; padding-left:1.7em; }
  .markdown-body li+li{ margin-top:.3em; }
  .markdown-body li::marker{ color:var(--quote); }
  .markdown-body ul.contains-task-list{ list-style:none; padding-left:0; }
  .markdown-body input[type=checkbox]{ margin-right:.5em; accent-color:var(--accent); }
  .markdown-body code{ font-family:var(--mono); font-size:.84em; background:var(--code-bg); padding:.18em .42em; border-radius:5px; }
  .markdown-body pre{ font-family:var(--mono); font-size:84%; line-height:1.55; background:var(--pre-bg);
    border:1px solid var(--border); box-shadow:var(--shadow); padding:18px 20px; border-radius:10px;
    overflow:auto; margin:0 0 1.4em; }
  .markdown-body pre code{ background:transparent; padding:0; font-size:100%; }
  /* hljs theme spans: never let theme background fight our own surfaces */
  .markdown-body pre code.hljs{ background:transparent !important; }
  /* Muted editorial code palette (overrides vendored GitHub colors) */
  .markdown-body .hljs-keyword,.markdown-body .hljs-selector-tag,.markdown-body .hljs-doctag,
  .markdown-body .hljs-template-tag,.markdown-body .hljs-type{ color:#9a5b2e; }
  .markdown-body .hljs-string,.markdown-body .hljs-regexp,.markdown-body .hljs-meta .hljs-string{ color:#4e7a52; }
  .markdown-body .hljs-number,.markdown-body .hljs-literal,.markdown-body .hljs-attr,
  .markdown-body .hljs-operator,.markdown-body .hljs-variable,.markdown-body .hljs-template-variable{ color:#8a6414; }
  .markdown-body .hljs-comment,.markdown-body .hljs-quote,.markdown-body .hljs-formula{ color:#9c8f74; font-style:italic; }
  .markdown-body .hljs-title,.markdown-body .hljs-title.function_,.markdown-body .hljs-section{ color:#3f5a78; }
  .markdown-body .hljs-built_in,.markdown-body .hljs-symbol,.markdown-body .hljs-name{ color:#7a5c48; }
  html.dark .markdown-body .hljs-keyword,html.dark .markdown-body .hljs-selector-tag,
  html.dark .markdown-body .hljs-doctag,html.dark .markdown-body .hljs-template-tag,
  html.dark .markdown-body .hljs-type{ color:#d69a63; }
  html.dark .markdown-body .hljs-string,html.dark .markdown-body .hljs-regexp,
  html.dark .markdown-body .hljs-meta .hljs-string{ color:#a4c08a; }
  html.dark .markdown-body .hljs-number,html.dark .markdown-body .hljs-literal,
  html.dark .markdown-body .hljs-attr,html.dark .markdown-body .hljs-operator,
  html.dark .markdown-body .hljs-variable,html.dark .markdown-body .hljs-template-variable{ color:#d9b36a; }
  html.dark .markdown-body .hljs-comment,html.dark .markdown-body .hljs-quote,
  html.dark .markdown-body .hljs-formula{ color:#8f8069; font-style:italic; }
  html.dark .markdown-body .hljs-title,html.dark .markdown-body .hljs-title.function_,
  html.dark .markdown-body .hljs-section{ color:#a9c0d4; }
  html.dark .markdown-body .hljs-built_in,html.dark .markdown-body .hljs-symbol,
  html.dark .markdown-body .hljs-name{ color:#c09a72; }
  /* Editorial tables: hairline frame, micro-header, tabular numerals, no grid.
     Every table arrives wrapped in .tw (done by the Rust renderer), and .tw is
     the scroll container. That containment is the whole trick: a sticky element
     resolves against its NEAREST scrollport, so because .tw scrolls, the header
     sticks to .tw and survives the page scrolling underneath it. Letting the page
     scroll the table instead (no wrapper) also pins, but then a wide table has
     nowhere to scroll and drags the whole reading column sideways.
     max-height is what gives the wrapper a vertical scroll range to pin against;
     without it a tall table just runs off the page under a header glued to it.
     The cap is generous and measured against the viewport rather than a row
     count — a wide table wraps its cells, so ten rows of a ten-column table can
     be as tall as fifty of a narrow one, and a row-count cap would trap those in
     a pointless little scroller. Ordinary tables stay one unbroken block. */
  /* width:max-content makes the frame hug the table instead of boxing in the
     whole column, and auto margins centre it. max-width:100% still clamps a
     table wider than the column, so that case degrades to a full-width frame
     with the table scrolling inside it. */
  .tw{ width:max-content; max-width:100%; margin:0 auto 1.4em;
    border:1px solid var(--border); border-radius:10px; background:var(--card);
    overflow:auto; max-height:min(85vh, 1200px); }
  .markdown-body table{ width:max-content; margin:0;
    border-collapse:separate; border-spacing:0;
    font-family:var(--sans); font-size:.86em; font-variant-numeric:tabular-nums; }
  /* A table wider than the column scrolls inside .tw; one that fits is centred
     by the auto side margins above and never shows a scrollbar.

     max-width caps a CELL's ideal width, which is the actual cause of runaway
     tables: a cell holding a full sentence wants the whole sentence on one
     line, and the table's ideal width is the sum of those, so a three-column
     clinical table renders ~3300px wide and the reader spends their time
     scrolling sideways instead of reading. Capping the cell makes the text
     wrap at word boundaries within a readable measure, and columns keep their
     natural relative widths — a narrow column like "Line" stays narrow, because
     max-width only bounds the maximum, it does not equalise columns the way
     table-layout:fixed would. Measured on the CANMAT guide (45 tables): 36ch
     takes document-wide horizontal scrolling from 38 tables down to 10 and
     brings table 2.6 from 3279px to 783px, which fits the column outright.
     break-word is the safety net for a cell holding one unbreakable token
     (a URL, an identifier), which would otherwise spill past the cap. */
  .markdown-body table th,.markdown-body table td{ padding:9px 16px; border:0;
    border-bottom:1px solid var(--border); text-align:left; vertical-align:top;
    max-width:36ch; overflow-wrap:break-word; }
  /* The last row carries no rule: .tw's own frame is the outer edge, which is
     what makes the table read as a bordered object instead of loose lines. */
  .markdown-body table tbody tr:last-child td{ border-bottom:0; }
  .markdown-body table thead th{ font-weight:600; font-size:.8em; letter-spacing:.07em;
    text-transform:uppercase; color:var(--quote);
    border-bottom:1px solid var(--tbl-head-line);
    position:sticky; top:0; z-index:2; background:var(--card); }
  .markdown-body table tr{ background:transparent; }
  .markdown-body table tbody tr:nth-child(2n){ background:var(--tbl-alt); }
  /* Row hover is a whisper of deeper paper, never a hue shift: readable on
     both plain and zebra rows, in both themes. */
  .markdown-body table tbody tr:hover{ background:var(--tbl-hover); }
  /* A display equation wider than the column would otherwise widen the whole
     reading pane and make the page scroll sideways, which also throws off the
     centring of everything else in the column. Give it its own scroll box so
     the column holds its width; on paper it is unrolled instead (see @media
     print), since a printed page cannot be scrolled either. */
  .markdown-body .math-display{ display:block; overflow-x:auto; }
  .markdown-body img{ max-width:100%; border-radius:8px; }
  .markdown-body video{ max-width:100%; border-radius:8px; background:#000; }
  .markdown-body audio{ max-width:100%; }
  .markdown-body kbd{ font-family:var(--mono); font-size:11px; background:var(--pre-bg); border:1px solid var(--border); border-bottom-width:2px; border-radius:6px; padding:2px 5px; }
  .empty{ min-height:60vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .drop{ width:100%; max-width:580px; border:1px dashed var(--quote-bar); border-radius:16px; background:var(--card);
    box-shadow:var(--shadow); padding:44px 36px; text-align:center; outline:none; transition:border-color .15s, box-shadow .15s; }
  .drop.over{ border-color:var(--accent); box-shadow:var(--shadow),0 0 0 3px var(--accent-soft); }
  .drop h1{ font-family:var(--serif); font-size:22px; margin:0 0 8px; font-weight:600; letter-spacing:-.01em; }
  .drop p{ margin:8px 0; color:var(--quote); font-size:13.5px; }
  .drop kbd{ border:1px solid var(--border); border-bottom-width:2px; border-radius:6px; padding:1px 7px;
    font:12px var(--mono); background:var(--bg); }
  .row{ display:flex; gap:10px; justify-content:center; margin-top:20px; }
  .btn{ border:1px solid var(--border); background:var(--card); color:inherit; border-radius:9px; padding:8px 16px;
    cursor:pointer; font-size:13px; font-family:var(--sans); transition:background .15s,border-color .15s,box-shadow .15s; }
  .btn:hover{ border-color:var(--quote-bar); box-shadow:var(--shadow); }
  .btn.primary{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  html.dark .btn.primary{ color:#1a1512; }
  .hint{ margin-top:16px; font-size:12px; color:var(--quote); }
  .err{ max-width:var(--read-width); margin:0 auto 14px; padding:11px 16px; border:1px solid #c1544a; border-radius:10px;
    background:rgba(193,84,74,.08); font-size:13px; font-family:var(--sans); display:none; }
  /* Save button: quiet until it has something to say. */
  #save svg{ display:block; width:15px; height:15px; }
  #save.saved{ color:var(--accent); }
  #save.flash{ animation:mdv-save-flash .6s ease; }
  @keyframes mdv-save-flash{ 0%{ background:var(--accent-soft); border-color:var(--accent); }
    100%{ background:transparent; border-color:transparent; } }
  @media (prefers-reduced-motion: reduce){ #save.flash{ animation:none; } }
  /* Tab rename: the input inherits the tab's type and sits exactly where the
     title was, so renaming never shifts the tab strip. */
  .tab-input{ font:inherit; font-size:12.5px; color:inherit; background:transparent;
    border:0; border-bottom:1px solid var(--accent); padding:0; margin:0;
    width:120px; max-width:160px; outline:none; }
  /* "This looks like a saved document" banner. A whisper, not a modal. */
  .similar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:0 0 18px; padding:11px 14px; border:1px solid var(--border);
    border-radius:10px; background:var(--card); box-shadow:var(--shadow);
    font:13px/1.45 var(--sans); }
  .similar>span{ flex:1; min-width:200px; color:var(--quote); }
  .similar b{ color:var(--fg); font-weight:600; }
  .similar .btn{ padding:6px 12px; font-size:12.5px; }
  /* Editing: each markdown block is wrapped in a boxless .md-block carrying
     its source index; the wrapper disappears entirely (display:contents). */
  .md-block{ display:contents; }
  /* Keep the old >*:first/last margin collapse now that blocks are wrapped. */
  .markdown-body>.md-block:first-child>:first-child{ margin-top:0 !important; }
  .markdown-body>.md-block:last-child>:last-child{ margin-bottom:0 !important; }
  .md-block-hidden{ display:none !important; }
  body.editing .markdown-body .md-block{ cursor:text; }
  body.editing .markdown-body .md-block:hover>*{ outline:1.5px dashed var(--accent); outline-offset:3px; border-radius:4px; }
  #editBtn[aria-pressed="true"]{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
  #editBtn:disabled{ opacity:.35; cursor:default; }
  /* The cell: a calm paper card with a hairline bar, CodeMirror inside. */
  .md-cell{ display:block; margin:0 0 1.05em; border:1px solid var(--border);
    border-radius:12px; background:var(--card); overflow:hidden;
    outline:2px solid var(--accent); outline-offset:1px; box-shadow:var(--shadow); }
  .cell-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:3px 12px; border-bottom:1px solid var(--border); background:var(--pre-bg);
    font:600 10.5px/1.6 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--quote); }
  .cell-bar .cell-hint{ font-weight:400; letter-spacing:0; text-transform:none; font-size:11px; }
  .cell-bar kbd{ font:10px var(--mono); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:0 4px; margin:0 1px; }
  .md-cell .cm-editor{ background:transparent; font-size:13px; }
  .md-cell .cm-scroller{ min-height:2.4em; }
  .md-cell .cm-content{ font-family:var(--mono); padding:10px 12px; caret-color:var(--accent); line-height:1.6; }
  .md-cell .cm-focused,.srcview .cm-focused{ outline:none !important; }
  .md-cell .cm-line,.srcview .cm-line{ padding:0; }
  /* Whole-document source view (Ctrl+Shift+E): a full-height editing layer over
     everything, Esc or Ctrl+Shift+E applies. */
  .srcview{ position:fixed; inset:var(--bar-h) 0 0 0; z-index:150; display:flex; flex-direction:column;
    background:var(--bg); }
  .srcview-bar{ display:flex; align-items:center; gap:12px; padding:8px 16px;
    border-bottom:1px solid var(--border); background:var(--bar); font:12.5px var(--sans); color:var(--quote); }
  .srcview-bar b{ color:var(--fg); font-weight:600; }
  .srcview-bar kbd{ font:10.5px var(--mono); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:0 5px; }
  .srcview-body{ flex:1; min-height:0; overflow:auto; }
  .srcview .cm-editor{ height:100%; background:var(--card); }
  .srcview .cm-scroller{ height:100%; }
  .srcview .cm-content{ font-family:var(--mono); padding:14px 20px; caret-color:var(--accent); line-height:1.6; }
  /* Close-tab confirmation: one purpose, three plain buttons. */
  .confirm{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:rgba(20,16,12,.45); backdrop-filter:blur(3px); }
  #confirmSave[hidden]{ display:none !important; }
  .confirm-box{ width:min(430px,90vw); border:1px solid var(--border); border-radius:14px;
    background:var(--card); box-shadow:var(--shadow); padding:18px; font:13.5px/1.5 var(--sans); }
  .confirm-box h2{ font-family:var(--serif); font-size:16px; margin:0 0 6px; font-weight:600; }
  .confirm-box p{ color:var(--quote); margin:0 0 14px; font-size:13px; }
  .confirm-row{ display:flex; justify-content:flex-end; gap:8px; }
  /* Saved documents on the welcome screen. */
  .saved-docs{ margin-top:26px; padding-top:22px; border-top:1px solid var(--border); text-align:left; }
  .saved-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin-bottom:12px; }
  .saved-head h2{ font-family:var(--serif); font-size:16px; font-weight:600; margin:0; }
  .saved-search{ flex:1; min-width:200px; max-width:340px; padding:7px 11px;
    border:1px solid var(--border); border-radius:9px; background:var(--bg);
    color:var(--fg); font:13px var(--sans); outline-offset:2px; }
  .saved-search:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  .saved-list{ display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto; }
  .saved-item{ display:flex; align-items:center; gap:2px; width:100%;
    border:1px solid var(--border); background:var(--card); border-radius:10px;
    transition:border-color .15s, box-shadow .15s, background .15s; }
  .saved-item:hover{ border-color:var(--quote-bar); box-shadow:var(--shadow); background:rgba(122,96,58,.08); }
  .saved-main{ flex:1; min-width:0; border:0; background:transparent; color:inherit;
    text-align:left; font:inherit; cursor:pointer; border-radius:9px;
    padding:9px 4px 9px 12px; display:flex; flex-direction:column; gap:3px; }
  .saved-main:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  if(p.theme==="dark"){ darkMode = true; touched = true; }
  else if(p.theme==="light"){ darkMode = false; touched = true; }
  if(typeof p.fontScale==="number" && p.fontScale>=0.6 && p.fontScale<=2.2){ fontScale = p.fontScale; touched = true; }
  if(typeof p.readWidth==="number" && p.readWidth>=620 && p.readWidth<=1180){ readWidth = p.readWidth; touched = true; }
  if(p.tocPos==="left"||p.tocPos==="right"||p.tocPos==="center"){ setTocPos(p.tocPos); touched = true; }
  // Highlight palettes, one per theme (customized hexes, validated per value).
  // A flat single set (written before the palettes were split per theme)
  // applies to both.
  if(p.annColors && typeof p.annColors === "object"){
    const hexOk = v => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v.trim());
    let appliedNested = false;
    for(const theme of ["light", "dark"]){
      const src = p.annColors[theme];
      if(!src || typeof src !== "object") continue;
      for(const k of Object.keys(ANN_DEFAULT_LIGHT)){
        const v = src[k];
        if(hexOk(v)){ annPalette[theme][k] = v.trim().toLowerCase(); appliedNested = true; }
      }
    }
    if(!appliedNested){
      for(const k of Object.keys(ANN_DEFAULT_LIGHT)){
        const v = p.annColors[k];
        if(hexOk(v)){ annPalette.light[k] = v.trim().toLowerCase(); annPalette.dark[k] = v.trim().toLowerCase(); }
      }
    }
  }
  return touched;
}

function useIpc(){ return !!(window.ipc && window.ipc.postMessage); }
function rust(cmd, payload){
  return new Promise((resolve,reject)=>{
    if(!useIpc()){ reject(new Error("no-rust-ipc")); return; }
    const id = "r"+(++reqSeq);
    pending.set(id,{resolve,reject,cmd});

}
window.__mdview_ipc_result = function(id, ok, data){

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  if(fallback) return fallback;

function paintTabs(){

// Switching tabs only toggles a class — the strip is NOT rebuilt, so the
// element under a double click survives and `dblclick` can actually fire.
function updateActiveTabClass(){

}
function switchTab(id){
  if(activeCell) void commitCell("blur"); // never strand a live editor across tabs
  activeId = id;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+id));
  const t = tabs.find(x=>x.id===id);
  hideAnnPropose();

  updateActiveTabClass();

}
function actuallyCloseTab(id){
  tabs = tabs.filter(t=>t.id!==id);
  const v = document.getElementById("view-"+id); if(v) v.remove();
  annForgetTab(id);
  if(!tabs.length){ newTab(); return; }
  if(activeId===id) switchTab(tabs[tabs.length-1].id);
  // The strip always reflects the array: a structural change must repaint.
  // (switchTab only toggles the active class by design — it cannot remove
  // the closed tab's button, so do it here regardless of the path.)
  paintTabs();
  maybeReleaseAssets();
}
// Closing a tab with a live editor mid-sentence must never happen silently:
// commit what the user typed, or tear it down by explicit choice.
function closeTab(id){
  const t = tabs.find(x=>x.id===id);
  const cellDirty = !!(activeCell && t && activeCell.tab === t && activeCell.view.state.sliceDoc() !== activeCell.orig);
  const srcDirty = !!(sourceView && t && sourceView.tab === t && sourceView.view.state.sliceDoc() !== sourceView.orig);
  if(!cellDirty && !srcDirty){ actuallyCloseTab(id); return; }
  void askConfirm().then(choice => {
    if(choice === "cancel") return;
    if(choice === "apply"){
      // 'apply' runs synchronously through the splice, so the store has the
      // text before the tab dies; auto-save flushes with immediate=true.
      if(cellDirty) void commitCell("blur");
      if(srcDirty) closeSourceView(true);
    } else {
      if(cellDirty && activeCell){
        const c = activeCell; activeCell = null;
        const blk = c.blkEl; c.view.destroy(); c.cell.remove();
        if(blk) blk.classList.remove("md-block-hidden");
      }
      if(srcDirty) closeSourceView(false);
    }
    actuallyCloseTab(id);
  });
}
// Once no open tab still needs the inflated KaTeX/mermaid bundle, ask Rust to
// drop it — a reading session that has left math and diagrams behind returns
// to its near-idle footprint instead of holding ~2.5MB for the rest of the day.
// Derived from the live DOM rather than a counter, so it can't drift.
function maybeReleaseAssets(){
  if(!useIpc()) return;
  const stillNeeded = tabs.some(t=>{
    const v = document.getElementById("view-"+t.id);
    return v && (v.querySelector(".katex") || v.querySelector(".mermaid svg"));
  }) || editMode || !!document.querySelector(".md-cell") || !!sourceView;
  if(!stillNeeded) rust("release_asset").catch(()=>{});
}
function cur(){ return tabs.find(t=>t.id===activeId); }

/* ---------- internal document database ---------- */
// The Rust side owns the SQLite store; these helpers are the only JS that
// touches it. Every call goes through the same `rust()` bridge as the rest of
// the app, and every result is JSON.
function sourceInfo(base, source){
  const s = String(source||"").trim();
  if(s) return { kind: /^(https?:\/\/|file:\/\/\/)/i.test(s) ? "url" : "file", ref: s };
  const b = String(base||"").trim();
  if(/^https?:\/\//i.test(b)) return { kind:"url", ref:b };
  if(b) return { kind:"file", ref:b };
  return { kind:"paste", ref:"" };
}
function dbCall(cmd, payload){
  return rust(cmd, payload).then(r=>{
    if(typeof r !== "string") return r;
    try{ return JSON.parse(r); }catch(e){ return r; }
  });
}
function relTime(secs){
  const s = Math.max(0, Math.floor(Date.now()/1000) - Number(secs||0));
  if(s < 60) return "just now";
  const m = Math.floor(s/60); if(m < 60) return m+"m ago";
  const h = Math.floor(m/60); if(h < 24) return h+"h ago";
  const d = Math.floor(h/24); if(d < 30) return d+"d ago";
  const mo = Math.floor(d/30); if(mo < 12) return mo+"mo ago";
  return Math.floor(mo/12)+"y ago";
}
function updateSaveState(){
  const t = cur(), b = $("#save");

  const saved = !!(t && t.savedId != null);
  b.classList.toggle("saved", saved);
  b.setAttribute("aria-pressed", saved ? "true" : "false");
  b.title = saved ? "Saved — Ctrl+S updates it" : "Save document (Ctrl+S)";
}
function updateWindowTitle(){

}
async function saveCurrent(){
  if(activeCell) commitCell("stay"); // Ctrl+S must see what the user just typed
  const t = cur(); if(!t || !t.md) return;
  if(!useIpc()){ showErr(t, "Saving needs the mdview app."); return; }
  try{
    const d = await dbCall("save_document", {
      doc_id: t.savedId, title: t.name, text: t.md,
      base: t.base||"", source_kind: t.sourceKind, source_ref: t.sourceRef
    });
    if(!d || typeof d !== "object" || d.id == null) throw new Error("bad response");
    t.savedId = d.id;
    if(d.title) t.name = d.title;
    if(d.id != null) mdvAnnotationsRefresh(t.id);
    paintTabs();
    updateSaveState();
    updateWindowTitle();
    const b = $("#save");
    if(b){ b.classList.add("flash"); setTimeout(()=> b.classList.remove("flash"), 600); }
  }catch(e){
    showErr(t, "Could not save: " + (e.message||e));
  }
}
$("#save").onclick = ()=> saveCurrent();

function startRenameTab(t, tabEl){
  const s = tabEl.querySelector(".t"); if(!s) return;
  const input = document.createElement("input");
  input.className = "tab-input";
  input.value = t.name;
  input.maxLength = 60;
  input.setAttribute("aria-label", "Document title");
  s.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = ()=>{
    if(done) return; done = true;
    const name = input.value.trim() || t.name;
    t.name = name.slice(0,48);
    paintTabs();
    updateWindowTitle();
    if(t.savedId != null && useIpc()) rust("rename_document", { doc_id: t.savedId, title: t.name }).catch(e=> showErr(t, "Could not rename: " + (e.message||e)));
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); commit(); }
    else if(e.key === "Escape"){ e.preventDefault(); done = true; paintTabs(); }
  });
  input.addEventListener("click", e=> e.stopPropagation());
  input.addEventListener("dblclick", e=> e.stopPropagation());
}

async function findSimilar(t){
  if(!useIpc() || !t.md || t.similarDismissed) return;
  try{
    const m = await dbCall("find_similar", { text: t.md, source_ref: t.sourceRef });
    if(!m || typeof m !== "object") return;
    if(t.similarDismissed || t.savedId != null) return;
    // Same file/URL reopened from its own source: it *is* the same document,
    // so treat it as already saved. A match from a different source is only
    // an offer — a rename or Ctrl+S is never re-pointed at it silently.
    const sameSource = m.source_ref && m.source_ref === t.sourceRef;
    if(sameSource){
      if(t.savedId !== m.id){ t.savedId = m.id; updateSaveState(); }
      return;
    }
    if(m.id != null) showSimilar(t, m);
  }catch(e){
    showErr(t, "Could not check the saved-document store: " + (e.message||e));
  }
}
function showSimilar(t, m){

  span.appendChild(b);

  const open = document.createElement("button");
  open.type = "button"; open.className = "btn primary"; open.textContent = "Open saved";
  open.onclick = ()=> openSavedDocument(m.id, t).catch(e=> showErr(t, "Could not open the saved document."));
  const dismiss = document.createElement("button");
  dismiss.type = "button"; dismiss.className = "btn"; dismiss.textContent = "Dismiss";
  dismiss.onclick = ()=>{ box.remove(); t.similarDismissed = true; };
  box.appendChild(span); box.appendChild(open); box.appendChild(dismiss);

  if(page) page.prepend(box);

async function openSavedDocument(id, replaceTab){
  const d = await dbCall("open_document", { doc_id: id });
  if(!d || typeof d !== "object" || typeof d.text !== "string") throw new Error("bad document");
  if(replaceTab){
    replaceTab.md = d.text;
    replaceTab.name = d.title || replaceTab.name;
    replaceTab.base = d.base || "";
    const si = sourceInfo(d.base, d.source_ref);
    replaceTab.sourceKind = si.kind; replaceTab.sourceRef = si.ref;
    replaceTab.savedId = d.id;
    replaceTab.similarDismissed = true;
    paintTabs();
    renderTab(replaceTab);
    mdvAnnotationsRefresh(replaceTab.id);
    updateSaveState();
    updateWindowTitle();

    const t = newTab(d.text, d.title, d.base, d.source_ref);
    t.savedId = d.id;
    t.similarDismissed = true;
    mdvAnnotationsRefresh(t.id);

}
let loadSavedSeq = 0;
async function loadSavedList(container, query){
  if(!container || !container.isConnected) return;
  const seq = ++loadSavedSeq; // drop stale responses — the newest request wins
  if(!useIpc()){
    container.innerHTML = '<div class="saved-empty">Saved documents are available in the mdview app.</div>';
    return;
  }
  try{
    let rows;
    if(query && query.trim()){
      rows = await dbCall("search_documents", { query: query.trim(), limit: 20 });
    } else {
      rows = await dbCall("recent_documents", { limit: 8 });
    }
    if(seq !== loadSavedSeq) return; // superseded while the IPC roundtrip ran
    if(!Array.isArray(rows)) rows = [];
    if(!container.isConnected) return;
    if(!rows.length){
      container.innerHTML = '<div class="saved-empty">'
        + (query && query.trim()
            ? "No saved documents match “"+esc(query.trim())+"”."
            : "No saved documents yet. Save one with Ctrl+S.")
        + '</div>';
      return;
    }
    container.innerHTML = "";
    for(const r of rows){
      const title = r.title || "untitled";
      const item = document.createElement("div");
      item.className = "saved-item";
      const main = document.createElement("button");
      main.type = "button";
      main.className = "saved-main";
      main.setAttribute("aria-label", "Open " + title);
      const t = document.createElement("div"); t.className = "saved-title"; t.textContent = title;
      const meta = document.createElement("div"); meta.className = "saved-meta"; meta.textContent = relTime(r.updated_at);
      const snip = document.createElement("div"); snip.className = "saved-snippet"; snip.textContent = r.preview || r.snippet || "";
      main.appendChild(t); main.appendChild(meta); main.appendChild(snip);
      main.onclick = ()=> openSavedDocument(r.id).catch(e=> showErr(cur()||{id:activeId}, "Could not open the saved document: " + (e.message||e)));
      const del = document.createElement("button");
      del.type = "button";
      del.className = "saved-x";
      del.textContent = "×";
      del.title = "Delete saved document";

      item.appendChild(main); item.appendChild(del);

  }catch(e){

    }

}
// Delete a saved document with a two-click confirm: the first click arms the
// button ("Delete?"), a second click within three seconds deletes, anything
// else disarms. No modals, no silent deletes.
function disarmDeleteSaved(btn){
  btn.dataset.armed = "0";
  btn.classList.remove("armed");
  btn.textContent = "×";
  clearTimeout(btn._armedTimer);
}
function requestDeleteSavedDocument(id, item, container, btn){
  if(btn.dataset.armed === "1"){ void confirmDeleteSavedDocument(id, item, container, btn); return; }
  btn.dataset.armed = "1";
  btn.classList.add("armed");
  btn.textContent = "Delete?";

}
async function confirmDeleteSavedDocument(id, item, container, btn){
  try{
    const ok = await dbCall("delete_document", { doc_id: id });
    if(ok !== true){
      showErr(cur()||{id:activeId}, "Could not delete the saved document (it may already be gone).");
      disarmDeleteSaved(btn);
      return;
    }
    // Any tab still marked saved points at a document the store no longer
    // holds — fall them all back to unsaved rather than claiming otherwise.
    for(const t of tabs){ if(t.savedId === id) t.savedId = null; }
    mdvAnnotationsInvalidateDoc(id); // its annotations cascade away with it
    updateSaveState();
    item.remove();
    if(!container.isConnected) return;
    if(!container.querySelector(".saved-item")){
      const empty = document.createElement("div");
      empty.className = "saved-empty";
      empty.textContent = "No saved documents yet. Save one with Ctrl+S.";
      container.appendChild(empty);
    }
  }catch(e){
    showErr(cur()||{id:activeId}, "Could not delete the saved document: " + (e.message||e));
    disarmDeleteSaved(btn);
  }
}
// Hook for the future highlight/annotation feature: making a highlight or a
// note auto-saves the document so it has a stable database identity. Calls
// are trailing-edge debounced (bursts collapse into one IPC), every pending
// tab is flushed, and failures surface — never swallowed. The document row is
// created (or updated) before any annotation references it.
const autoSaveJobs = [];
let autoSaveTimer = 0;
// `immediate` skips the 500ms coalescing debounce for one-shot user actions
// (annotations) — the flush still coalesces everything queued so far.
window.mdviewAutoSaveDocument = function(t, immediate){
  return new Promise(resolve=>{
    if(!useIpc() || !t || !t.md){ resolve(null); return; }
    autoSaveJobs.push({ t, resolve });
    if(immediate){ void flushAutoSave(); return; }
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(flushAutoSave, 500);
  });
};
async function flushAutoSave(){
  const jobs = autoSaveJobs.splice(0);
  for(const { t, resolve } of jobs){
    try{
      const d = await dbCall("auto_save_document", {
        title: t.name, text: t.md, base: t.base||"",
        source_kind: t.sourceKind, source_ref: t.sourceRef
      });
      if(d && d.id != null){ t.savedId = d.id; updateSaveState(); mdvAnnotationsRefresh(t.id); }
      resolve(d);
    }catch(e){
      showErr(t, "Could not auto-save the document: " + (e.message||e));
      resolve(null);
    }
  }
}

/* ---------- highlights & annotations ---------- */
// Annotations are W3C-style selectors against the *rendered* text, not the
// markdown source: an exact quote plus fixed prefix/suffix context, with
// JS string offsets kept only as a fast-path hint. The stored quote is never
// rewritten; orphans are kept and shown as "needs review", never re-pointed.
// Everything goes through the SQLite store — nothing is kept in localStorage.
const ANN_CONTEXT = 64; // characters of context stored on each side of a quote
const ANN_SKIP = "svg, .mermaid, .katex-mathml, script, style, noscript, [aria-hidden='true'], #annPanel, #annEditor, .ann-note-marker";
const ANN_NOTE_DEBOUNCE = 400; // ms; mirrors the welcome-screen search debounce
const ANN_TRASH_SVG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6h11M8 5.8V4.9A1.4 1.4 0 0 1 9.4 3.5h1.2A1.4 1.4 0 0 1 12 4.9v.9M6.5 6l.66 9.2a1.4 1.4 0 0 0 1.4 1.3h3a1.4 1.4 0 0 0 1.4-1.3L13.9 6"/></svg>';
const ANN_NOTE_SVG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h7"/></svg>';
const ANN_COLORS = ["yellow", "green", "blue", "pink", "purple"];
const ANN_DEFAULT_LIGHT = { yellow: "#e6b93c", green: "#7cae78", blue: "#5d94c7", pink: "#c3788f", purple: "#9b83c9" };
const ANN_DEFAULT_DARK  = { yellow: "#f0c85a", green: "#8fca89", blue: "#7cb9e9", pink: "#e496ac", purple: "#b39ae4" };
// The five circle colors are TWO independently saved palettes — one per
// theme. Highlights are stored as slot names, so light and dark sets are
// edited independently (prefs.json) and both slots repaint instantly.
const annPalette = { light: { ...ANN_DEFAULT_LIGHT }, dark: { ...ANN_DEFAULT_DARK } };

function annPaletteInject(){

    const n = parseInt(h.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";

    "::highlight(mdv-ann-" + c + "){background:" + hex(annPalette.light[c], .52) + ";color:inherit}" +
    "html.dark ::highlight(mdv-ann-" + c + "){background:" + hex(annPalette.dark[c], .62) + ";color:inherit}"

function annSyncSwatches(row){

// Per open tab: DB rows, resolution results and the flat-text caches.
const annState = new Map(); // tabId -> { rows, resolved: Map(id), flat, seq }
let annSelectedColor = "yellow";
let annEditorState = null; // { tabId, anchor?, row?, color, armTimer, expanded }
let annProposeAnchor = null; // the selection anchor behind the floating propose button
const annPaintSupported = !!(window.CSS && CSS.highlights && typeof Highlight === "function");

// Flat text = concatenated textContent of the visible article content, with
// non-content subtrees skipped. Deterministic for a given render, so stored
// offsets are stable across boots.
function annFlat(root){
  const accept = n => {
    if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
    const p = n.parentElement;
    if(!p || p.closest(ANN_SKIP)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: accept });
  const nodes = [], starts = [];
  let text = "";
  while(walker.nextNode()){
    const n = walker.currentNode;
    starts.push(text.length);
    nodes.push(n);
    text += n.nodeValue;
  }
  return { text, nodes, starts };
}
// Offset of a selection point inside the flat text, or null when the point
// falls inside a skipped subtree. Element boundaries (select-all) resolve to
// the start of the next accepted text node, or the end of the flat text.
function annFlatOffset(flat, root, node, offset){
  if(node && node.nodeType === 3){ // TEXT_NODE
    const i = flat.nodes.indexOf(node);
    if(i < 0) return null;
    return flat.starts[i] + Math.max(0, Math.min(offset, node.nodeValue.length));
  }
  const accept = n => {
    if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
    const p = n.parentElement;
    if(!p || p.closest(ANN_SKIP)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: accept });
  walker.currentNode = node;
  const next = walker.nextNode();
  if(!next) return flat.text.length;
  const i = flat.nodes.indexOf(next);
  return i >= 0 ? flat.starts[i] : null;
}
// The anchor captured from a live selection. `exact` is sliced from the flat
// text itself, so it can never disagree with the stored quote.
function annAnchorFromSelection(root, sel, flat){
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if(!root.contains(range.startContainer) || !root.contains(range.endContainer)) return null;
  flat = flat || annFlat(root);
  let start = annFlatOffset(flat, root, range.startContainer, range.startOffset);
  let end = annFlatOffset(flat, root, range.endContainer, range.endOffset);
  if(start == null || end == null) return null;
  if(start > end){ const t = start; start = end; end = t; }
  if(start === end) return null;
  const exact = flat.text.slice(start, end);
  if(!exact.trim()) return null;
  return {
    exact, start, end,
    prefix: flat.text.slice(Math.max(0, start - ANN_CONTEXT), start),
    suffix: flat.text.slice(end, end + ANN_CONTEXT),
  };
}
function annCommonPrefix(a, b){ let n = 0; while(n < a.length && n < b.length && a[n] === b[n]) n++; return n; }
function annCommonSuffix(a, b){ let n = 0; while(n < a.length && n < b.length && a[a.length - 1 - n] === b[b.length - 1 - n]) n++; return n; }
// Re-anchor a stored selection against the current flat text. Returns
// {start, end} when the evidence is sufficient, otherwise null (orphan).
// Exported on window so the browser test-suite can exercise it directly.
function resolveAnchor(text, a){
  const exact = String(a && a.exact || "");
  if(!exact.trim()) return null;
  const start = a.start | 0, end = a.end | 0;
  if(start >= 0 && end > start && end <= text.length && text.slice(start, end) === exact){
    return { start, end }; // nothing moved: the strongest possible match
  }
  const candidates = [];
  let i = text.indexOf(exact);
  while(i !== -1){ candidates.push(i); i = text.indexOf(exact, i + 1); }
  if(!candidates.length) return null;
  if(candidates.length === 1) return { start: candidates[0], end: candidates[0] + exact.length };
  // Duplicated passage: only context can disambiguate. A strictly better
  // candidate with real context agreement wins; a tie is a refusal.
  const pre = String(a.prefix || ""), suf = String(a.suffix || "");
  let best = null, bestScore = -1, second = -1;
  for(const c of candidates){
    const p = annCommonSuffix(text.slice(Math.max(0, c - pre.length), c), pre);
    const s = annCommonPrefix(text.slice(c + exact.length, c + exact.length + suf.length), suf);
    const score = p * 2 + s * 2;
    if(score > bestScore){ second = bestScore; bestScore = score; best = { start: c, end: c + exact.length, p, s }; }
    else if(score > second) second = score;
  }
  if(best && second < bestScore && (best.p + best.s) >= 8){
    return { start: best.start, end: best.end };
  }
  return null;
}
window.mdviewAnnotationsResolve = resolveAnchor;
function annRangeFromOffsets(flat, start, end){
  if(start < 0 || end <= start || end > flat.text.length) return null;
  let sc = null, so = 0, ec = null, eo = 0;
  for(let i = 0; i < flat.nodes.length; i++){
    const n = flat.nodes[i], a = flat.starts[i], b = a + n.nodeValue.length;
    if(!sc && start >= a && start <= b){ sc = n; so = start - a; }
    if(end >= a && end <= b){ ec = n; eo = end - a; break; }
  }
  if(!sc || !ec) return null;
  try{
    const r = document.createRange();
    r.setStart(sc, so);
    r.setEnd(ec, eo);
    return r;
  }catch(_){ return null; }
}
function annStateOf(tabId){
  let s = annState.get(tabId);
  if(!s){ s = { rows: [], resolved: new Map(), flat: null, seq: 0, pending: [] }; annState.set(tabId, s); }
  return s;
}
function annForgetTab(tabId){
  annState.delete(tabId);
  hideAnnPropose();
  annRebuildPaint();
}
// Repaint every painted highlight from the per-tab resolved state.
function annRebuildPaint(){
  if(!annPaintSupported) return;
  const groups = {};
  for(const c of ANN_COLORS) groups[c] = [];
  for(const [tabId, st] of annState){
    if(!st.resolved.size && !st.pending.length) continue;
    const view = document.getElementById("view-" + tabId);
    if(!view || !view.isConnected){ annState.delete(tabId); continue; }
    for(const row of st.rows){
      const res = st.resolved.get(row.id);
      if(!res) continue;
      const range = st.flat ? annRangeFromOffsets(st.flat, res.start, res.end) : null;
      const color = ANN_COLORS.includes(row.color) ? row.color : "yellow";
      if(range) groups[color].push(range);
    }
    // Optimistic paints: same offsets, not yet confirmed by the store. The
    // refresh pass replaces them with the real rows (or drops them on error).
    if(st.flat){
      for(const p of st.pending){
        const range = annRangeFromOffsets(st.flat, p.start, p.end);
        if(range) groups[p.color].push(range);
      }
    }
  }
  for(const c of ANN_COLORS){
    const key = "mdv-ann-" + c;
    try{
      if(groups[c].length) CSS.highlights.set(key, new Highlight(...groups[c]));
      else CSS.highlights.delete(key);
    }catch(e){
      console.warn("mdview: could not paint highlight ranges", e);
    }
  }
}
// Non-intrusive proof that a highlight carries a note: a faded badge at the
// end of the anchored passage's last line. Clicking it opens the editor.
function annRenderMarkers(){
  document.querySelectorAll(".ann-note-marker").forEach(el => el.remove());
  const t = cur();
  if(!t) return;
  const state = annState.get(t.id);
  if(!state || !state.flat || !state.resolved.size) return;
  const view = document.getElementById("view-" + t.id);
  const page = view ? view.querySelector(".page") : null;
  if(!page) return;
  const pr = page.getBoundingClientRect();
  for(const row of state.rows){
    if(!row.note || !String(row.note).trim()) continue;
    const res = state.resolved.get(row.id);
    if(!res) continue;
    const range = annRangeFromOffsets(state.flat, res.start, res.end);
    if(!range) continue;
    const rects = range.getClientRects();
    if(!rects.length) continue;
    const r1 = rects[rects.length - 1];
    const m = document.createElement("button");
    m.type = "button";
    m.className = "ann-note-marker";
    m.innerHTML = ANN_NOTE_SVG;
    m.title = "Note: " + String(row.note).slice(0, 140);
    m.setAttribute("aria-label", "Highlight with note — activate to edit it");
    m.style.left = Math.max(0, Math.min(r1.right - pr.left - 15, pr.width - 18)) + "px";
    m.style.top = Math.max(0, r1.top - pr.top - 6) + "px";
    m.onclick = e => { e.stopPropagation(); annOpenEditor(t, row, annRectNearPoint(e.clientX, e.clientY)); };
    page.appendChild(m);
  }
}
// Fresh truth: list the document's annotations, resolve them against the
// live render, paint, and persist any re-anchoring that changed something.
async function mdvAnnotationsRefresh(tabId){
  hideAnnPropose(); // a re-render invalidates the selection it floated next to
  const t = tabs.find(x => x.id === tabId);
  const state = annStateOf(tabId);
  const seq = ++state.seq;
  state.rows = []; state.resolved = new Map(); state.flat = null;
  if(t && t.savedId != null && useIpc()){
    try{
      const rows = await dbCall("annotation_list", { doc_id: t.savedId });
      if(state.seq !== seq) return; // a newer render won the race
      state.rows = Array.isArray(rows) ? rows : [];
      state.pending.length = 0; // fresh truth wins over optimistic paints
    }catch(e){
      if(state.seq === seq && t) showErr(t, "Could not load annotations: " + (e.message || e));
    }
  }
  const view = t ? document.getElementById("view-" + t.id) : null;
  const root = view ? view.querySelector(".markdown-body") : null;
  if(t && root && (state.rows.length || state.pending.length)){
    const flat = annFlat(root);
    state.flat = flat;
    if(state.rows.length) for(const row of state.rows){
      const res = resolveAnchor(flat.text, row);
      if(res) state.resolved.set(row.id, res);
      // Persist re-anchoring only when something changed; orphans keep their
      // stored prefix/suffix so a revert can find them again.
      const prefix = res ? flat.text.slice(Math.max(0, res.start - ANN_CONTEXT), res.start) : row.prefix;
      const suffix = res ? flat.text.slice(res.end, res.end + ANN_CONTEXT) : row.suffix;
      const want = { prefix, suffix,
        start: res ? res.start : row.start,
        end: res ? res.end : row.end,
        state: res ? "active" : "orphan" };
      if(want.prefix !== row.prefix || want.suffix !== row.suffix
         || want.start !== row.start || want.end !== row.end || want.state !== row.state){
        dbCall("annotation_refresh_anchor", {
          annotation_id: row.id, prefix: want.prefix, suffix: want.suffix,
          start: want.start, end: want.end, state: want.state,
        }).catch(e => showErr(t, "Could not re-anchor an annotation: " + (e.message || e)));
        row.prefix = want.prefix; row.suffix = want.suffix;
        row.start = want.start; row.end = want.end; row.state = want.state;
      }
    }
  }
  annRebuildPaint();
  annUpdateBadge();
  annRenderPanelList();
  annRenderMarkers();
}
function annUpdateBadge(){
  const b = $("#annCount");
  if(!b) return;
  const t = cur();
  const n = t ? annStateOf(t.id).rows.length : 0;
  b.textContent = n > 0 ? String(n) : "";
  const toggle = $("#annToggle");
  if(toggle){
    toggle.setAttribute("aria-pressed", $("#annPanel") && !$("#annPanel").hidden ? "true" : "false");
    toggle.title = n > 0
      ? "Highlights and notes (" + n + ") — Ctrl+Shift+A"
      : "Highlights and notes (Ctrl+Shift+A)";
  }
}
function annRenderPanelList(){
  const panel = $("#annPanel");
  if(!panel || panel.hidden) return;
  const sub = $("#annSubtitle"), list = $("#annList");
  const t = cur();
  if(!t){
    sub.textContent = "";
    list.innerHTML = '<div class="ann-empty">Open a document to annotate it.</div>';
    return;
  }
  sub.textContent = t.name || "This document";
  const state = annStateOf(t.id);
  if(!useIpc()){
    list.innerHTML = '<div class="ann-empty">Annotations are stored in the mdview app.</div>';
    return;
  }
  if(t.savedId == null){
    list.innerHTML = '<div class="ann-empty">No highlights yet.<br><br>Select a passage — the document is stored automatically so its highlights have a stable home.</div>';
    return;
  }
  if(!state.rows.length){
    list.innerHTML = '<div class="ann-empty">No highlights yet.<br><br>Select text, hit the highlighter — that is the whole flow.</div>';
    return;
  }
  list.innerHTML = "";
  for(const row of state.rows){
    const item = document.createElement("div");
    item.className = "ann-item";
    item.tabIndex = 0;
    item.setAttribute("role", "button");
    item.setAttribute("aria-label", (row.note ? "Highlight with note: " : "Highlight: ") + String(row.exact || "").slice(0, 80));
    const q = document.createElement("div"); q.className = "ann-quote"; q.textContent = row.exact;
    item.appendChild(q);
    if(row.note){
      const n = document.createElement("div"); n.className = "ann-note"; n.textContent = row.note;
      item.appendChild(n);
    }
    const meta = document.createElement("div"); meta.className = "ann-meta";
    const dot = document.createElement("span"); dot.className = "ann-dot";
    dot.style.background = annPaletteOf()[row.color] || annPaletteOf().yellow;
    meta.appendChild(dot);
    const label = document.createElement("span");
    label.textContent = row.note ? "Highlight · Note" : "Highlight";
    meta.appendChild(label);
    if(row.state === "orphan"){
      const chip = document.createElement("span"); chip.className = "ann-orphan"; chip.textContent = "needs review";
      meta.appendChild(chip);
    }
    item.appendChild(meta);
    const open = () => {
      const res = state.resolved.get(row.id);
      if(res && state.flat){
        const range = annRangeFromOffsets(state.flat, res.start, res.end);
        const host = range && range.startContainer.parentElement;
        if(host && host.scrollIntoView) host.scrollIntoView({ block: "center", behavior: "smooth" });
      }
      annOpenEditor(t, row, annRectNearPoint(window.innerWidth / 2, 120));
    };
    item.onclick = open;
    item.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } };
    list.appendChild(item);
  }
}
function annRectNearPoint(x, y){ return { left: x, top: y, bottom: y + 1, right: x }; }
// The non-intrusive proposal button: appears just below the caret after a
// selection, vanishes on click-away/scroll/Escape/new selection. Clicking it
// opens the editor — no modal, ever.
function showAnnPropose(anchor, sel){
  const btn = $("#annPropose");
  if(!btn) return;
  annProposeAnchor = anchor;
  const range = sel.rangeCount ? sel.getRangeAt(0) : null;
  let r = range ? range.getBoundingClientRect() : null;
  const rects = range ? range.getClientRects() : null;
  if(rects && rects.length) r = rects[rects.length - 1]; // the caret's line
  const size = 34;
  const left = Math.max(8, Math.min((r ? r.right : 40) + 4, window.innerWidth - size - 8));
  const top = Math.max(8, Math.min((r ? r.bottom : 100) + 6, window.innerHeight - size - 8));
  btn.style.left = left + "px";
  btn.style.top = top + "px";
  btn.hidden = false;
}
function hideAnnPropose(){
  const btn = $("#annPropose");
  if(btn) btn.hidden = true;
  annProposeAnchor = null;
}
function annTogglePanel(force){
  const panel = $("#annPanel");
  if(!panel) return;
  const show = force === undefined ? panel.hidden : !!force;
  panel.hidden = !show;
  if(show) annRenderPanelList();
  annUpdateBadge();
}
// Propose click = the action itself: the highlight is stored instantly with
// the default color. Identity first — an unsaved document is auto-saved so
// the highlight has a stable home.
async function annCreateFromSelection(anchor){
  const t = cur();
  if(!t || !useIpc()) return;
  hideAnnPropose();
  const view = document.getElementById("view-" + t.id);
  const root = view ? view.querySelector(".markdown-body") : null;
  const state = annStateOf(t.id);
  if(root) state.flat = annFlat(root);
  // Optimistic: the highlight paints now, the store confirms in the
  // background. Dropped again only if the write actually fails.
  const pending = { color: annSelectedColor, start: anchor.start, end: anchor.end };
  state.pending.push(pending);
  annRebuildPaint();
  const dropOptimistic = () => {
    const i = state.pending.indexOf(pending);
    if(i >= 0) state.pending.splice(i, 1);
    annRebuildPaint();
  };
  // ::selection paints over ::highlight — drop it so the new highlight is
  // visible right away.
  try{ window.getSelection().removeAllRanges(); }catch(_){}
  if(t.savedId == null){
    await window.mdviewAutoSaveDocument(t, /* immediate */ true);
  }
  if(t.savedId == null){
    dropOptimistic();
    showErr(t, "Could not save the document, so the highlight was not stored.");
    return;
  }
  try{
    const a = await dbCall("annotation_add", {
      doc_id: t.savedId, exact: anchor.exact, prefix: anchor.prefix,
      suffix: anchor.suffix, start: anchor.start, end: anchor.end,
      color: annSelectedColor, note: "",
    });
    if(!a || typeof a !== "object" || a.id == null) throw new Error("bad response");
    mdvAnnotationsRefresh(t.id); // reconciles pending against the stored rows
  }catch(e){
    dropOptimistic();
    showErr(t, "Could not save the highlight: " + (e.message || e));
  }
}
// A circle click IS the action: immediate recolor of the open annotation.
async function annApplyEditorColor(c){
  const es = annEditorState;
  if(!es || !es.row) return;
  const t = tabs.find(x => x.id === es.tabId);
  if(!t){ annCloseEditor(); return; }
  if(!useIpc()) return;
  // Optimistic: move the painted range into the new color group now; the
  // store write reconciles (and reverts) in the background.
  const previousColor = es.row.color;
  es.row.color = c;
  annRebuildPaint();
  annCloseEditor();
  dbCall("annotation_update", { annotation_id: es.row.id, color: c, note: es.row.note || "" })
    .then(ok => {
      if(ok !== true) throw new Error("the annotation no longer exists");
      return mdvAnnotationsRefresh(t.id); // single source of truth: re-list, re-paint
    })
    .catch(e => {
      es.row.color = previousColor;
      annRebuildPaint();
      showErr(t, "Could not recolor the annotation: " + (e.message || e));
    });
}
// Notes save themselves, debounced like the home-screen search box — there
// is no Save button to press.
async function annSaveNote(){
  const es = annEditorState;
  if(!es || !es.row || !es.input) return;
  es.noteTimer = null; // the debounce fired; nothing pending
  const t = tabs.find(x => x.id === es.tabId);
  if(!t) return;
  const note = es.input.value;
  if(note === String(es.row.note || "")) return;
  try{
    const ok = await dbCall("annotation_update", { annotation_id: es.row.id, color: es.color, note });
    if(ok !== true) throw new Error("the annotation no longer exists");
    es.row.note = note;
    mdvAnnotationsRefresh(t.id); // markers + panel follow the note
  }catch(e){
    showErr(t, "Could not save the note: " + (e.message || e));
  }
}
function annOpenEditor(t, row, rect){
  const editor = $("#annEditor");
  if(!editor || !row) return;
  hideAnnPropose();
  const color = ANN_COLORS.includes(row.color) ? row.color : "yellow";
  // A stored note is the point of opening the editor: open with it visible.
  const hasNote = !!(row.note && String(row.note).trim());
  annEditorState = { tabId: t.id, row, color, armTimer: null, expanded: hasNote, input: null, noteTimer: null };
  editor.innerHTML = "";

    const b = document.createElement("button");
    b.type = "button";
    b.className = "ann-color";
    b.dataset.color = c;
    b.style.background = annPaletteOf()[c];
    b.title = "Highlight " + c;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", c === color ? "true" : "false");
    b.onclick = () => {
      annEditorState.color = c;
      annSelectedColor = c;

        x.setAttribute("aria-checked", String(x.dataset.color === c));

  picker.className = "ann-color ann-picker";
  picker.title = "Customize this color";
  picker.setAttribute("aria-label", "Customize this color");
  const colorInput = document.createElement("input");
  colorInput.type = "color";
  colorInput.className = "ann-color-input";
  colorInput.setAttribute("aria-hidden", "true");
  colorInput.tabIndex = -1;
  colorInput.value = annPaletteOf()[color] || ANN_DEFAULT_LIGHT[color] || "#e6b93c";
  colorInput.oninput = () => {
    annPaletteOf()[annEditorState.color] = colorInput.value.toLowerCase();
    annPaletteInject();
    annSyncSwatches(colors);
    savePrefs();
  };
  picker.onclick = () => colorInput.click();
  colors.appendChild(picker);
  // Pencil expands/collapses the note area.
  const pencil = document.createElement("button");
  pencil.type = "button";

  pencil.title = hasNote ? "Hide note" : "Add a note";

  pencil.setAttribute("aria-label", "Toggle note");
  colors.appendChild(pencil);
  // Delete: icon, two-click arm to confirm (same pattern as everywhere else).
  const del = document.createElement("button");
  del.type = "button";
  del.className = "ann-color ann-trash";
  del.innerHTML = ANN_TRASH_SVG;
  del.title = "Delete highlight";

    if(del.dataset.armed === "1"){ void annDeleteEditorRow(); return; }
    del.dataset.armed = "1";

async function annDeleteEditorRow(){
  const es = annEditorState;

  if(es.noteTimer){ clearTimeout(es.noteTimer); es.noteTimer = null; } // don't resurrect after delete
  const rowId = es.row.id;

  if(t){
    const state = annStateOf(t.id);

// Caret position -> flat offset, used for click-to-edit on painted highlights.
function annHitAt(t, x, y){
  // Edit mode is a hard wall between the two gesture systems: no hit-testing,
  // no highlight opening, ever, while the editor is up.
  if(editMode) return null;
  const state = annState.get(t.id);
  if(!state || !state.flat || !state.resolved.size) return null;
  const view = document.getElementById("view-" + t.id);
  const root = view ? view.querySelector(".markdown-body") : null;
  if(!root) return null;
  let range = null;
  try{
    if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if(document.caretPositionFromPoint){
      const p = document.caretPositionFromPoint(x, y);
      if(p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
    }
  }catch(_){ return null; }
  if(!range || !root.contains(range.startContainer)) return null;
  const off = annFlatOffset(state.flat, root, range.startContainer, range.startOffset);
  if(off == null) return null;
  // Overlapping highlights: the most specific (smallest span) wins, with the
  // most recently created winning ties — sub-chunks layer over the passage
  // that contains them, not the other way around.
  let best = null, bestSize = Infinity;
  for(const row of state.rows){
    const res = state.resolved.get(row.id);
    if(!res || off < res.start || off > res.end) continue;
    const size = res.end - res.start;
    if(size < bestSize || (size === bestSize && best && row.id > best.row.id)){
      best = { row, res };
      bestSize = size;
    }
  }
  return best;
}

function annWireEvents(){
  $("#annToggle").addEventListener("click", () => annTogglePanel());
  $("#annClose").addEventListener("click", () => annTogglePanel(false));
  $("#annPropose").addEventListener("click", e => {
    const t = cur();
    let anchor = annProposeAnchor;
    // The button can be hit inside the selection-settle window; recompute
    // from the live selection rather than swallowing the click.
    if(!anchor && t){
      const view = document.getElementById("view-" + t.id);
      const root = view ? view.querySelector(".markdown-body") : null;
      if(root) anchor = annAnchorFromSelection(root, window.getSelection());
    }
    if(!t || !anchor){ hideAnnPropose(); return; }
    // One click, one highlight of the default color: no dialog to dismiss.
    void annCreateFromSelection(anchor);
  });
  // Click-away dismisses the proposal button (pointerdown fires before the
  // selection collapses, so it catches every other click).
  document.addEventListener("pointerdown", e => {
    const btn = $("#annPropose");
    if(btn && !btn.hidden && !(e.target === btn || (e.target.closest && e.target.closest("#annPropose")))
       && !(e.target.closest && (e.target.closest(".md-cell") || e.target.closest(".srcview")))){
      hideAnnPropose();
    }
  }, true);
  document.addEventListener("pointerup", e => {
    if(e.button !== 0) return;
    if(e.target.closest && e.target.closest("#annPanel, #annEditor, #annPropose, #bar, .md-cell, .srcview")) return;
    if(editMode) return;
    if(!useIpc()) return;
    const t = cur();
    if(!t || !t.rendered) return;
    const view = document.getElementById("view-" + t.id);
    if(!view || !view.classList.contains("active")) return;
    const root = view.querySelector(".markdown-body");
    if(!root) return;
    setTimeout(() => {
      const sel = window.getSelection();
      const anchor = annAnchorFromSelection(root, sel);
      if(anchor){
        const editor = $("#annEditor");
        if(editor && !editor.hidden) annCloseEditor(); // a fresh selection takes over
        showAnnPropose(anchor, sel);
      } else hideAnnPropose();
    }, 70);
  });
  document.addEventListener("click", e => {
    const editor = $("#annEditor");
    // Containment, not visibility: editor buttons (recolor, trash) hide the
    // palette synchronously in their own handler, so `editor.hidden` alone
    // would misclassify this very click as one on the document beneath it.
    const inEditor = editor && editor.contains(e.target);
    const inPanel = e.target.closest && e.target.closest("#annPanel");
    const inPropose = e.target.closest && e.target.closest("#annPropose");
    const inCell = e.target.closest && (e.target.closest(".md-cell") || e.target.closest(".srcview"));
    if(inEditor || inPanel || inPropose || inCell) return;
    if(editMode) return; // edit blocks handle their own clicks; highlights are inert
    // A click that ends a selection drag is a new highlight opportunity, not
    // an intent to edit the one underneath — only the proposal button shows.
    // (A plain click collapses the selection, so this only suppresses the
    // drag case.)
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed && sel.rangeCount) return;
    const t = cur();
    const hit = t ? annHitAt(t, e.clientX, e.clientY) : null;
    if(hit){
      annOpenEditor(t, hit.row, annRectNearPoint(e.clientX, e.clientY));
      return;
    }
    if(editor && !editor.hidden) annCloseEditor();
  });
  document.addEventListener("keydown", e => {
    // The cell editor owns Escape while it is open; the highlight system stays out.
    if(activeCell || sourceView) return;
    if(e.key === "Escape"){
      const editor = $("#annEditor");
      if(editor && !editor.hidden){ e.preventDefault(); annCloseEditor(); return; }
      hideAnnPropose();
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.shiftKey && (e.key === "A" || e.key === "a")){
      e.preventDefault();
      annTogglePanel();
    }
  });
  window.addEventListener("resize", () => {
    const editor = $("#annEditor");
    if(editor && !editor.hidden) annCloseEditor();
    hideAnnPropose();
    annRenderMarkers(); // reflow can move lines; ranges stay valid, just reposition
  });
  window.addEventListener("scroll", () => {
    const editor = $("#annEditor");
    if(editor && !editor.hidden) annCloseEditor();
    hideAnnPropose();
  }, true);
}

/* ---------- errors ---------- */
function showErr(t, msg){
  const v = document.getElementById("view-"+t.id); if(!v) return;
  const e = v.querySelector(".err"); e.style.display="block"; e.textContent = msg;
  clearTimeout(showErr._t); showErr._t = setTimeout(()=>{ e.style.display="none"; }, 6000);

/* ---------- input classification ---------- */
function looksUrl(s){
  s = s.trim().replace(/^["'<>\s]+|["'<>\s]+$/g,"");
  return /^(https?:\/\/|file:\/\/\/)[^\s]{4,2000}$/i.test(s);
}
function looksPath(s){
  const t = s.trim().replace(/^["']+|["']+$/g,"");
  if(!t || t.length>600 || /\n/.test(t)) return null;
  if(/^(https?:|file:)/i.test(t)) return null;
  if(/^[A-Za-z]:[\\/][^\n?*<>|"]+$/.test(t)) return t;
  if(/^\\\\[^\n?*<>|"]+$/.test(t)) return t;
  if(/^\/[^\n\0]+$/.test(t) && /\.(md|markdown|mdown|mkd|txt|text)$/i.test(t)) return t;
  if(/^\.(\\|\/)[^\n?*<>|"]+$/.test(t)) return t;
  return null;
}

/* ---------- paste / drop / browse ---------- */
// Rust IPC returns docs as a JSON string (or already-parsed array).
function parseDocs(x){
  if(Array.isArray(x)) return x;
  if(typeof x === "string"){
    try{ const v = JSON.parse(x); return Array.isArray(v) ? v : []; }catch(e){}
  }
  return [];
}
// Open docs-with-base payloads: fill the first UNLOADED tab (the active one
// when it's pristine, otherwise any pristine tab — switched into view), the
// rest get their own tabs. A rendered tab is never overwritten this way.
// Returns true when something was opened.
function openDocs(docs, intoTab){
  docs = (docs||[]).filter(d=>d && typeof d.text === "string" && d.text.length);
  if(!docs.length) return false;
  let t0 = intoTab || cur();
  let useFirst = !!(t0 && !t0.rendered && !t0.md);
  if(!useFirst && !intoTab){
    t0 = tabs.find(x=>!x.rendered && !x.md) || null;
    useFirst = !!t0;
  }
  for(const d of docs){
    if(useFirst){ setMarkdown(t0, d.text, d.name, d.base, d.source); switchTab(t0.id); useFirst = false; }
    else newTab(d.text, d.name, d.base, d.source);
  }
  return true;
}
// Copied files in Explorer sit on the Windows clipboard as CF_HDROP; only
// Rust can see those real paths, and with them the images resolve too.
// True = docs opened this way.
async function tryPasteClipboardFiles(){
  if(!useIpc()) return false;
  try{
    return openDocs(parseDocs(await rust("clipboard_files")));
  }catch(e){ return false; }
}
// Native open-file dialog — returns paths, so images load like every flow.
async function pickFileDialog(t){
  try{
    if(openDocs(parseDocs(await rust("pick_file")), t)) return;
  }catch(err){
    const m = String(err && err.message || err);
    if(m && !/cancel/i.test(m)) showErr(t, m);
  }
}
async function pasteFromClipboard(t){
  if(await tryPasteClipboardFiles()) return;
  if(useIpc()){
    // Native path: WebView2's navigator.clipboard.read() is permission-blocked
    // in the app, so Rust reads the Windows clipboard directly — same as every
    // other native clipboard read here.
    try{
      const txt = String(await rust("clipboard_text") || "");
      if(txt && txt.trim()){ await ingestText(t, txt, null); return; }
      showErr(t, "Clipboard is empty (or holds no text).");
    }catch(e){
      showErr(t, "Could not read the clipboard: " + (e.message || e));
    }
    return;
  }
  // Standalone preview only: the browser API may still be blocked there.
  try{
    const items = await navigator.clipboard.read();
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith("image/")) continue;
        if(type==="text/plain"||type==="text/html"||type.startsWith("text/")){
          const blob = await item.getType(type);
          const txt = await blob.text();
          if(txt && txt.trim()){ await ingestText(t, txt, null); return; }
        }
      }
    }
  }catch(e){ /* fall through to readText / Ctrl+V handler */ }
  try{
    const txt = await navigator.clipboard.readText();
    if(txt && txt.trim()) await ingestText(t, txt, null);
    else showErr(t,"Clipboard is empty.");
  }catch(e){
    showErr(t,"Clipboard read blocked — press Ctrl+V inside this window.");
  }
}

async function ingestText(t, text, nameHint){
  const raw = String(text||"");
  if(!raw.trim()) return;
  const p = looksPath(raw.trim());
  if(p){
    try{
      const content = await rust("read_file",{path:p});
      // Opened as a document: goes to the unloaded tab, never over the
      // reader's currently open page.
      openDocs([{text:String(content), name:shortName(p), base:parentDir(p)}]);
      return;
    }catch(e){ /* not readable — fall through and render as text */ }
  }
  if(looksUrl(raw.trim())){
    const u = raw.trim();
    try{
      const content = await rust("fetch_url",{url:u});
      openDocs([{text:String(content), name:shortName(u), base:u}]);
      return;
    }catch(e){ showErr(t,"Could not fetch URL ("+e.message+"). Rendering as pasted text."); }
  }
  setMarkdown(t, raw, nameHint || titleOf(raw), "", "");
}
function parentDir(p){
  try{
    const s = String(p).replace(/^[a-z]+:\/\//i,"");
    const parts = s.replace(/\\/g,"/").split("/");
    parts.pop();
    return parts.join("/")||".";
  }catch(e){ return ""; }
}
function shortName(p){
  try{
    let s = String(p).replace(/^[a-z]+:\/\//i,"").replace(/^file:\/\/\//,"");
    s = s.split("?")[0].split("#")[0];
    const parts = s.replace(/\\/g,"/").split("/").filter(Boolean);
    return parts.length?parts[parts.length-1].slice(0,40):"pasted";
  }catch(e){ return "pasted"; }
}
const DOC_RE = /\.(m?md|markdown|mdown|mkd|txt|text)$/i;
// Fallback for file objects that arrive WITHOUT paths (rare — every native
// flow hands Rust a real path, which carries the directory for images).
async function ingestFiles(t, files){
  if(!files||!files.length) return;
  const texts = [];
  for(const f of files){
    if(f.type && (f.type.startsWith("image/")||f.type.startsWith("video/")||f.type.startsWith("audio/"))){
      showErr(t,"Images are not rendered as markdown ("+f.name+").");
      continue;
    }
    try{ texts.push({name:f.name, text: await f.text()}); }
    catch(e){ showErr(t,"Cannot read "+f.name); }
  }
  if(!texts.length) return;
  openDocs([{text:texts[0].text, name:texts[0].name, base:"", source:""}]);
  for(let i=1;i<texts.length;i++) newTab(texts[i].text, texts[i].name, "", "");
}
// OS drags sometimes leak paths as text/uri-list (Firefox) or plain text —
// a free upgrade to full base resolution when present, harmless otherwise.
function pickDocFromUriList(s){
  return String(s||"").split("\n").map(x=>x.trim()).filter(x=>x && !x.startsWith("#"))
    .map(x=>x.replace(/^file:\/\/\//i,"")).map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } })
    .find(x=>DOC_RE.test(x.split("?")[0].split("#")[0]));
}

document.addEventListener("paste", async e=>{
  const t = cur(); if(!t) return;
  const v = document.getElementById("view-"+t.id);
  if(v && !v.classList.contains("active")) return;
  e.preventDefault(); // this app IS the paste target
  // DataTransfer dies the instant the event dispatch ends (Chromium clears
  // the protected store) — capture text/files BEFORE any await, or a real
  // Ctrl+V reads back empty after the IPC roundtrip.
  const txt = e.clipboardData ? e.clipboardData.getData("text") : "";
  const evFiles = (e.clipboardData && e.clipboardData.files) ? Array.from(e.clipboardData.files) : [];
  // Files copied in Explorer win over text: Rust reads CF_HDROP paths, so
  // the doc opens with its directory and its images load themselves.
  if(await tryPasteClipboardFiles()) return;
  if(txt){ await ingestText(t, txt, null); return; }
  if(evFiles.length) await ingestFiles(t, evFiles);
});
document.addEventListener("dragover", e=>{ e.preventDefault(); const t=cur(); const d=document.querySelector("#view-"+(t&&t.id)+" .drop"); if(d) d.classList.add("over"); });
document.addEventListener("dragleave", e=>{ if(e.target.classList&&e.target.classList.contains("drop")) e.target.classList.remove("over"); });

  e.preventDefault();

  // Native OLE drop (wry) opens docs with REAL paths before this ever runs;
  // what follows only covers a rare JS-only drop. Capture the DataTransfer
  // synchronously — it goes dead after the first await.
  let uri="", plain="", files=[];
  try{

    }
  }catch(err){}
