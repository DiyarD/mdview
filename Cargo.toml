[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
description = "Instant, near-zero-idle-memory markdown viewer for Windows: global hotkey, paste anything, GitHub markdown + code highlighting + LaTeX + Mermaid + print-ready output."
readme = "README.md"
keywords = ["markdown", "viewer", "webview2", "katex", "mermaid", "windows"]
categories = ["text-processing", "viewers"]
license = "MIT"

[dependencies]
tao = "0.37"
wry = "0.57"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
http = "1"
url = "2"
# Remote images: fetched by the app with Chrome TLS/HTTP2 impersonation so
# extensionless and Cloudflare-gated image URLs load. BoringSSL -> btls-sys
# needs NASM at *build* time only; nothing of it ships in the app binary.
tokio = { version = "1", features = ["rt-multi-thread"] }
wreq = "0.16"
wreq-util = "0.2"
# Internal document database: compressed markdown + FTS5 search + SimHash.
# Bundled so the app ships one SQLite build and never depends on the OS copy.
rusqlite = { version = "0.42", features = ["bundled"] }
# Pure-Rust DEFLATE decoder, used only to unpack the vendored JS/CSS assets
# (mermaid/katex/hljs are stored gzipped in the binary to keep it small).
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
global-hotkey = "0.8"
tray-icon = "0.25"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
